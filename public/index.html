<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AiSKAR – Крестики Нолики</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="container">
  <h1>AiSKAR</h1>

  <button id="play-ai">Играть против AiSKAR</button>
  <button id="play-friend">Играть с другом</button>

  <div id="game" class="hidden">
    <h2 id="status"></h2>

    <div class="board" id="board"></div>

    <div id="chat">
      <div id="messages"></div>
      <input id="msgInput" placeholder="напишите сообщение...">
      <button id="sendMsg">Отправить</button>
    </div>

    <button id="exit">Выйти в меню</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
