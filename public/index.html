<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AiSKAR — Крестики-нолики</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>AiSKAR</h1>
  
  <div id="menu">
    <button class="btn" id="play-ai">Играть против AiSKAR</button>
    <button class="btn" id="play-friend">Играть с другом</button>
  </div>

  <!-- Блок приглашения друга -->
  <div id="invite-block" class="hidden">
    <p>Выберите способ:</p>

    <button id="generate-link" class="btn small">Создать ссылку-приглашение</button>
    <p id="generated-link" class="link hidden"></p>

    <p>или пригласить по username:</p>
    <input id="friend-username" placeholder="username друга">
    <button id="send-invite" class="btn small">Отправить приглашение</button>

    <button class="btn back" id="invite-back">Назад</button>
  </div>

  <!-- ИГРОВОЕ ПОЛЕ -->
  <!-- ПРИГЛАШЕНИЯ -->
<div id="invite-panel" class="hidden">
  <p id="invite-text"></p>

  <button id="accept-invite" class="btn small">Принять</button>
  <button id="reject-invite" class="btn small">Отклонить</button>
</div>

  <div id="game" class="hidden">
      <div id="board"></div>

      <div id="status"></div>

      <div id="chat">
        <div id="chat-box"></div>
        <input id="chat-input" placeholder="напишите сообщение...">
        <button id="chat-send" class="btn small">Отправить</button>
      </div>

      <button class="btn back" id="exit-menu">Выйти в меню</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
